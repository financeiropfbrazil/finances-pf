# notify-pedido-criador: reachable sem JWT (o cron/pg_net não manda JWT). A auth
# real é o gate CRON_SECRET dentro da função (L2 Entrega 1). Declarado aqui para
# o deploy NÃO flipar verify_jwt=true e quebrar o cron jobid 21.
[functions.notify-pedido-criador]
verify_jwt = false

# notify-pedido-concluido: reachable sem JWT (o cron/pg_net não manda JWT).
# A auth real é o gate CRON_SECRET dentro da função (L2 Entrega 3).
[functions.notify-pedido-concluido]
verify_jwt = false

# rastro-nfe-feed: consumido pelo projeto irmão Rastro P&F, que não tem JWT do Hub.
# A auth real é o gate RASTRO_FEED_KEY (header x-rastro-key) dentro da função.
[functions.rastro-nfe-feed]
verify_jwt = false

# sync-laudos (REC-1.1): reachable sem JWT — o cron/pg_net não manda JWT.
# A auth real é o gate CRON_SECRET (header x-cron-secret) dentro da função.
[functions.sync-laudos]
verify_jwt = false

# sync-reqmat (OP-2.3): reachable sem JWT — o cron/pg_net não manda JWT.
# A auth real é o gate CRON_SECRET (header x-cron-secret) dentro da função.
# ⚠ Sem esta declaração o deploy deixa verify_jwt=true e o gateway do Supabase
# barra o pg_net ANTES da função: o CRON_SECRET nunca é avaliado e o cron nunca
# roda — sem erro visível até alguém notar a fila parada. Diagnosticado em
# 05/08/2026, quando a ausência deste bloco produziu UNAUTHORIZED_ASYMMETRIC_JWT.
# verify_jwt é lido NO DEPLOY, não em runtime ⇒ mudar isto exige redeploy.
[functions.sync-reqmat]
verify_jwt = false

# sync-parcelas-pagar-cron (Rastreio, LR-PAG F2): reachable sem JWT — o cron/pg_net
# não manda JWT. A auth real é o gate CRON_SECRET (header x-cron-secret) na função.
# Mesmo motivo do bloco do sync-reqmat: sem isto o deploy pelo CLI liga verify_jwt.
[functions.sync-parcelas-pagar-cron]
verify_jwt = false

# nfse-adn-sonda (PLANO-NFSE, NFSE-0.3): chamada manual via pg_net/servidor, sem JWT.
# A auth real é o gate CRON_SECRET (header x-cron-secret) na função.
[functions.nfse-adn-sonda]
verify_jwt = false

# nfse-ler-boleto (PLANO-NFSE, Fase B — teste de leitura): chamada pelo app (supabase.functions.invoke) ou pelo
# banco. A auth real está na função: usuário com compras.nfse.access (nfse_pode_acessar) ou x-cron-secret.
[functions.nfse-ler-boleto]
verify_jwt = false

[functions.extrair-nfe]
verify_jwt = false
