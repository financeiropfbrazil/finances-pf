name: multicc-integration
services:
  db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_PASSWORD: local-test-only
      JWT_SECRET: local-multicc-test-secret-at-least-32-characters
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - ./roles.sql:/docker-entrypoint-initdb.d/zz-multicc.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 2s
      retries: 60
  auth:
    image: supabase/gotrue:v2.189.0
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:55439:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:55439
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:local-test-only@db:5432/postgres
      GOTRUE_SITE_URL: http://127.0.0.1:55480
      GOTRUE_JWT_SECRET: local-multicc-test-secret-at-least-32-characters
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
  rest:
    image: postgrest/postgrest:v14.12
    depends_on:
      db: {condition: service_healthy}
    ports: ["127.0.0.1:55430:3000"]
    environment:
      PGRST_DB_URI: postgres://authenticator:local-test-only@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-multicc-test-secret-at-least-32-characters
  storage:
    image: supabase/storage-api:v1.60.4
    depends_on:
      db: {condition: service_healthy}
      rest: {condition: service_started}
    ports: ["127.0.0.1:55450:5000"]
    environment:
      ANON_KEY: ${ANON_KEY:?generated by prepare.mjs}
      SERVICE_KEY: ${SERVICE_KEY:?generated by prepare.mjs}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: local-multicc-test-secret-at-least-32-characters
      DATABASE_URL: postgres://supabase_storage_admin:local-test-only@db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: multicc-local
      REGION: local
      GLOBAL_S3_BUCKET: local
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes: ["objects:/var/lib/storage"]
volumes:
  objects:
