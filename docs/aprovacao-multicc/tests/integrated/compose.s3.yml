services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: multicc-local
      MINIO_ROOT_PASSWORD: local-minio-only
    healthcheck:
      test: [CMD-SHELL, "curl -f http://127.0.0.1:9000/minio/health/live"]
      interval: 2s
      retries: 40
    volumes: ["s3-objects:/data"]
  minio-setup:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 multicc-local local-minio-only && mc mb --ignore-existing local/multicc"]
  storage:
    depends_on:
      minio-setup: {condition: service_completed_successfully}
    environment:
      STORAGE_BACKEND: s3
      REGION: us-east-1
      GLOBAL_S3_BUCKET: multicc
      GLOBAL_S3_ENDPOINT: http://minio:9000
      GLOBAL_S3_PROTOCOL: http
      GLOBAL_S3_FORCE_PATH_STYLE: 'true'
      AWS_ACCESS_KEY_ID: multicc-local
      AWS_SECRET_ACCESS_KEY: local-minio-only
volumes:
  s3-objects:
